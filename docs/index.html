<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <p class="frame-count">browse events</p>
  <h1>Photo events</h1>
  <p class="intro">
    Each event has its own gallery of photos. Open one below to browse and
    download — select a few photos or grab the whole set at once.
  </p>

  <div class="filter-row" id="filter-row"></div>

  <div class="event-rows" id="rows"></div>
  <p class="empty" id="empty" style="display:none;">No public events yet.</p>
  <p class="status" id="status"></p>
</div>

<script src="config.js"></script>
<script src="github.js"></script>
<script>
const rowsEl = document.getElementById("rows");
const emptyEl = document.getElementById("empty");
const statusEl = document.getElementById("status");
const filterRowEl = document.getElementById("filter-row");

let publicEvents = [];
let activeCategory = null;

function renderRow(event) {
  const row = document.createElement("div");
  row.className = "event-row";
  row.innerHTML = `
    <div class="info">
      <a href="event.html?id=${event.id}">${event.name}</a>
      ${event.categories.length ? `<span class="slug">${event.categories.join(", ")}</span>` : ""}
    </div>
  `;
  return row;
}

function renderFilters() {
  const categories = [...new Set(publicEvents.flatMap((e) => e.categories))].sort();
  if (!categories.length) {
    filterRowEl.style.display = "none";
    return;
  }
  filterRowEl.style.display = "flex";
  filterRowEl.innerHTML = "";

  const allBtn = document.createElement("button");
  allBtn.className = `filter-chip${activeCategory === null ? " selected" : ""}`;
  allBtn.textContent = "All";
  allBtn.addEventListener("click", () => {
    activeCategory = null;
    renderFilters();
    renderList();
  });
  filterRowEl.appendChild(allBtn);

  categories.forEach((cat) => {
    const btn = document.createElement("button");
    btn.className = `filter-chip${activeCategory === cat ? " selected" : ""}`;
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      renderFilters();
      renderList();
    });
    filterRowEl.appendChild(btn);
  });
}

function renderList() {
  const shown = activeCategory
    ? publicEvents.filter((e) => e.categories.includes(activeCategory))
    : publicEvents;

  rowsEl.innerHTML = "";
  emptyEl.style.display = shown.length ? "none" : "block";
  shown.forEach((event) => rowsEl.appendChild(renderRow(event)));
}

async function loadEvents() {
  statusEl.textContent = "Loading events…";
  try {
    const events = await listEvents();
    publicEvents = events.filter((e) => e.visibility !== "private");
    statusEl.textContent = "";
    renderFilters();
    renderList();
  } catch (err) {
    statusEl.textContent = `Couldn't load events: ${err.message}`;
    statusEl.className = "status error";
  }
}

loadEvents();
</script>
</body>
</html>
