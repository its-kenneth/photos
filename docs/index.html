<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New event — contact sheet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <p class="frame-count">frame 001</p>
  <h1>Start a new event</h1>

  <div class="card">
    <div class="field">
      <label for="event-name">Event name</label>
      <input type="text" id="event-name" placeholder="Sarah &amp; Tom's wedding">
    </div>
    <div class="field">
      <label for="event-files">Photos (optional — you can add more later)</label>
      <input type="file" id="event-files" multiple accept="image/*">
    </div>
    <button id="create-btn">Create event</button>
    <p class="status" id="status"></p>
    <div class="link-box" id="link-box" style="display:none;"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="github.js"></script>
<script>
const createBtn = document.getElementById("create-btn");
const statusEl = document.getElementById("status");
const linkBox = document.getElementById("link-box");

createBtn.addEventListener("click", async () => {
  const name = document.getElementById("event-name").value.trim();
  const files = document.getElementById("event-files").files;

  if (!name) {
    statusEl.textContent = "Give the event a name first.";
    statusEl.className = "status error";
    return;
  }

  createBtn.disabled = true;
  statusEl.className = "status";
  statusEl.textContent = "Creating event…";

  try {
    const event = await createEvent(name);

    if (files.length) {
      let done = 0;
      for (const file of files) {
        statusEl.textContent = `Uploading photo ${++done} of ${files.length}…`;
        const result = await uploadPhoto(event.uploadUrlBase, file);
        if (result.error) throw new Error(result.error);
      }
    }

    const eventUrl = `${location.origin}${location.pathname.replace(/index\.html$/, "")}event.html?id=${event.id}`;
    statusEl.textContent = "Done.";
    linkBox.style.display = "block";
    linkBox.innerHTML = `Shareable link: <a href="${eventUrl}">${eventUrl}</a>`;
  } catch (err) {
    statusEl.textContent = `Something went wrong: ${err.message}`;
    statusEl.className = "status error";
  } finally {
    createBtn.disabled = false;
  }
});
</script>
</body>
</html>
