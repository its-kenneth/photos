<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links">
    <a class="back" href="index.html">&larr; new event</a>
    <a class="back" href="events.html">all events</a>
  </div>
  <p class="frame-count" id="frame-count">Event Photos</p>
  <div class="title-row">
    <h1 id="event-title">Loading…</h1>
    <button class="teal small" id="share-btn">Share link</button>
  </div>

  <div class="toolbar">
    <button class="secondary" id="select-all-btn">Select all</button>
    <button id="download-btn" disabled>Download selected (0)</button>
  </div>

  <div class="card" id="upload-card" style="margin-bottom:20px; display:none;">
    <label for="add-files">Add more photos to this event</label>
    <input type="file" id="add-files" multiple accept="image/*">
    <div style="margin-top:12px;"><button id="add-btn">Upload</button></div>
    <p class="status" id="add-status"></p>
  </div>

  <p class="hint" id="add-toggle" style="margin-bottom:20px;"></p>

  <div class="sheet" id="sheet"></div>
  <p class="empty" id="empty" style="display:none;">No photos here yet.</p>
  <p class="status" id="status"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="github.js"></script>
<script>
const params = new URLSearchParams(location.search);
const eventId = params.get("id");
const isEditMode = params.has("edit");

function shareUrl() {
  const clean = new URL(location.href);
  clean.searchParams.delete("edit");
  return clean.toString();
}

function editUrl() {
  const withEdit = new URL(location.href);
  withEdit.searchParams.set("edit", "1");
  return withEdit.toString();
}

const titleEl = document.getElementById("event-title");
const frameCountEl = document.getElementById("frame-count");
const sheetEl = document.getElementById("sheet");
const emptyEl = document.getElementById("empty");
const statusEl = document.getElementById("status");
const downloadBtn = document.getElementById("download-btn");
const selectAllBtn = document.getElementById("select-all-btn");

let assets = [];
const selected = new Set();

function updateToolbar() {
  downloadBtn.textContent = `Download selected (${selected.size})`;
  downloadBtn.disabled = selected.size === 0;
}

function renderSheet() {
  frameCountEl.textContent = `frame ${String(assets.length).padStart(3, "0")}`;
  sheetEl.innerHTML = "";
  emptyEl.style.display = assets.length ? "none" : "block";

  assets.forEach((asset, i) => {
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.innerHTML = `
      <img src="${asset.browser_download_url}" loading="lazy" alt="Photo ${i + 1}">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="check"></span>
    `;
    frame.addEventListener("click", () => {
      if (selected.has(asset.id)) {
        selected.delete(asset.id);
        frame.classList.remove("selected");
      } else {
        selected.add(asset.id);
        frame.classList.add("selected");
      }
      updateToolbar();
    });
    sheetEl.appendChild(frame);
  });
}

async function loadEvent() {
  if (!eventId) {
    statusEl.textContent = "No event id in the link.";
    statusEl.className = "status error";
    return;
  }

  document.getElementById("upload-card").style.display = isEditMode ? "block" : "none";
  const toggleEl = document.getElementById("add-toggle");
  toggleEl.innerHTML = isEditMode
    ? ""
    : `<a href="${editUrl()}">Add photos to this event</a>`;

  try {
    const release = await getEvent(eventId);
    titleEl.textContent = release.name;
    assets = release.assets;
    renderSheet();
  } catch (err) {
    titleEl.textContent = "Event not found";
    statusEl.textContent = err.message;
    statusEl.className = "status error";
  }
}

document.getElementById("add-btn").addEventListener("click", async () => {
  const files = document.getElementById("add-files").files;
  const addStatus = document.getElementById("add-status");
  if (!files.length) return;

  try {
    let done = 0;
    for (const file of files) {
      addStatus.className = "status";
      addStatus.textContent = `Uploading ${++done} of ${files.length}…`;
      const result = await uploadPhoto(eventId, file);
      if (result.error) {
        addStatus.textContent = `Failed on ${file.name}: ${result.error}`;
        addStatus.className = "status error";
        return;
      }
    }
    addStatus.textContent = "Uploaded. Refreshing…";
    await loadEvent();
    addStatus.textContent = "";
  } catch (err) {
    addStatus.textContent = `Something went wrong: ${err.message}`;
    addStatus.className = "status error";
  }
});

selectAllBtn.addEventListener("click", () => {
  if (selected.size === assets.length) {
    selected.clear();
  } else {
    assets.forEach((a) => selected.add(a.id));
  }
  document.querySelectorAll(".frame").forEach((el, i) => {
    el.classList.toggle("selected", selected.has(assets[i].id));
  });
  updateToolbar();
});

downloadBtn.addEventListener("click", async () => {
  const picked = assets.filter((a) => selected.has(a.id));
  if (!picked.length) return;

  downloadBtn.disabled = true;
  if (picked.length > 1) {
    statusEl.className = "status";
    statusEl.textContent = `Zipping ${picked.length} photos…`;
  }

  try {
    await zipAndDownloadAssets(picked, eventId);
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = `Couldn't build the zip: ${err.message}`;
    statusEl.className = "status error";
  } finally {
    downloadBtn.disabled = selected.size === 0;
  }
});

document.getElementById("share-btn").addEventListener("click", async () => {
  const shareBtn = document.getElementById("share-btn");
  const ok = await copyToClipboard(shareUrl());
  shareBtn.textContent = ok ? "Copied!" : "Couldn't copy";
  setTimeout(() => (shareBtn.textContent = "Share link"), 1500);
});

loadEvent();
</script>
</body>
</html>
